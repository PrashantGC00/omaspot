# kitty config for the omaspot overlay window only (your normal kitty keeps its own kitty.conf).
# Step 3 installs this to ~/.config/omaspot/kitty-overlay.conf.
include ~/.local/state/omarchy/current/theme/kitty.conf

font_family      JetBrainsMono Nerd Font
font_size        13.0
window_padding_width 0
# See-through window (Hyprland blurs what's behind it). omaspot paints its own cell colours, so
# background_opacity alone only reaches kitty's edge margin; transparent_background_colors makes omaspot's
# own background colours translucent too: window #101315, panels #0c0e10, selection #343d41.
background #101315
background_opacity 0.82
transparent_background_colors #101315@0.82 #0c0e10@0.88 #343d41@0.92
placement_strategy top-left
confirm_os_window_close 0
remember_window_size no
initial_window_width  1280
initial_window_height 800
cursor_blink_interval 0
mouse_hide_wait 0
# frames reach the screen sooner (defaults 10 and 3 ms): less lag while scrolling
repaint_delay 5
input_delay 1
allow_remote_control no

# every key goes to omaspot, except font zoom
clear_all_shortcuts yes
map ctrl+shift+equal     change_font_size current +1
map ctrl+shift+minus     change_font_size current -1
map ctrl+shift+backspace change_font_size current 0
